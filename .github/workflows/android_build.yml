name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # manuel tetikleme

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # veya 3.10, 3.9

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          curl

    - name: Install Buildozer
      run: pip install buildozer

    - name: Build with Buildozer
      run: |
        buildozer android debug
        # Eğer buildozer.spec farklı klasördeyse: buildozer -f path/to/buildozer.spec android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: elixir-apk
        path: bin/*.apk
